{% extends "base.html" %}
{% block title %}{{ t('become_guide') }} | Susambil{% endblock %}
{% block content %}
<section class="mx-auto max-w-3xl px-4 sm:px-6 pt-8">
  <h1 class="font-display text-3xl sm:text-4xl font-extrabold">{{ t('become_guide') }}</h1>
  <p class="mt-2 text-ink/70">Upload your photo and guide certificate. We review each application before publishing it.</p>
  <form method="post" action="/register-guide" enctype="multipart/form-data" class="panel p-6 mt-6 grid gap-4 sm:grid-cols-2">
    <input class="field" name="full_name" required minlength="2" maxlength="120" placeholder="Full name" data-tg-name>
    <input class="field" name="city" required maxlength="120" placeholder="City">
    <input class="field" name="languages" required maxlength="200" placeholder="Languages: English, Russian">
    <input class="field" name="experience_years" type="number" min="0" max="70" required placeholder="Years of experience">
    <input class="field" name="price_per_day" type="number" min="1" step="0.01" required placeholder="Price per day (USD)">
    <div></div>
    <textarea class="field sm:col-span-2" name="bio" rows="4" required minlength="10" maxlength="2000" placeholder="Tell travelers about your routes and style"></textarea>
    <label class="text-sm text-ink/70">Profile photo
      <input class="field mt-1" type="file" name="profile_image" accept=".jpg,.jpeg,.png,.webp" required>
    </label>
    <label class="text-sm text-ink/70">Certificate (image)
      <input class="field mt-1" type="file" name="certificate" accept=".jpg,.jpeg,.png,.webp" required>
    </label>
    <p class="sm:col-span-2 text-xs text-ink/60">jpg, jpeg, png or webp, up to 10 MB each.</p>
    <div class="hp" aria-hidden="true"><input type="text" name="bot_check" tabindex="-1" autocomplete="off"></div>
    <div class="sm:col-span-2"><button class="btn-brand" type="submit">Send application</button></div>
  </form>
</section>
{% endblock %}
